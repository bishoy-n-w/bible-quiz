<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة الكتاب المقدس</title>
    <style>
        :root { 
            --primary: #4a90e2; 
            --bg: #f5f7fa; 
            --text: #2c3e50; 
            --correct: #2ecc71; 
            --wrong: #e74c3c; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
            padding: 30px; 
            text-align: center; 
        }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 25px; }
        .score-board { 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
            margin-bottom: 25px; 
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        .question { font-size: 1.4rem; margin-bottom: 25px; line-height: 1.6; font-weight: 700; color: #34495e;}
        .options { display: grid; gap: 15px; }
        .option-btn { 
            background: #f8f9fa; 
            border: 2px solid #e9ecef; 
            border-radius: 10px; 
            padding: 15px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-family: inherit; 
            font-weight: 600;
            color: #2c3e50;
        }
        .option-btn:hover:not(:disabled) { background: #e2e6ea; border-color: #dae0e5; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .option-btn.correct { background: var(--correct); color: white; border-color: var(--correct); }
        .option-btn.wrong { background: var(--wrong); color: white; border-color: var(--wrong); }
        .feedback { 
            margin-top: 25px; 
            padding: 15px 20px; 
            border-radius: 10px; 
            background: #e8f4fd; 
            border-right: 5px solid var(--primary); 
            display: none; 
            text-align: right; 
            animation: fadeIn 0.5s;
        }
        .feedback p { margin: 0 0 10px 0; font-size: 1.1rem; line-height: 1.5; color: #2980b9;}
        .feedback small { color: #34495e; font-weight: bold; font-size: 1rem;}
        .next-btn { 
            margin-top: 25px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            display: none; 
            width: 100%; 
            font-family: inherit; 
            transition: 0.3s;
        }
        .next-btn:hover { background: #357abd; }
        .result-container { display: none; }
        .result-container h2 { font-size: 2.2rem; color: var(--primary); }
        .restart-btn { 
            margin-top: 25px; 
            background: var(--correct); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: inherit;
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quiz-container">
        <h1>مسابقة الكتاب المقدس 📖</h1>
        <div class="score-board">
            <span id="question-count">السؤال: 1 / 50</span>
            <span id="score-display">النقاط: 0</span>
        </div>
        <div class="question" id="question-text">جاري تحميل السؤال...</div>
        <div class="options" id="options-container">
            <!-- Buttons dynamically added here -->
        </div>
        <div class="feedback" id="feedback-container">
            <p id="verse-text"></p>
            <small id="reference-text"></small>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ➡️</button>
    </div>

    <div class="quiz-container result-container" id="result-container">
        <h2>🎉 انتهت المسابقة!</h2>
        <p style="font-size: 1.5rem; margin: 20px 0; font-weight: bold;" id="final-score">نتيجتك: </p>
        <button class="restart-btn" onclick="startQuiz()">العب مرة أخرى 🔄</button>
    </div>

    <script src="questions.js"></script>
    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startQuiz() {
            // فلترة الأسئلة للمستوى المتوسط وعرضها بشكل عشوائي
            currentQuestions = quizData.filter(q => q.level === 'medium');
            shuffleArray(currentQuestions);
            currentIndex = 0;
            score = 0;
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('result-container').style.display = 'none';
            updateScore();
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-count').innerText = `السؤال: ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('feedback-container').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selectedIndex, btnElement) {
            const q = currentQuestions[currentIndex];
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.answerIndex) {
                btnElement.classList.add('correct');
                score++;
                updateScore();
            } else {
                btnElement.classList.add('wrong');
                btns[q.answerIndex].classList.add('correct');
            }

            document.getElementById('verse-text').innerText = q.verse;
            document.getElementById('reference-text').innerText = "الشاهد: " + q.reference;
            document.getElementById('feedback-container').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateScore() {
            document.getElementById('score-display').innerText = `النقاط: ${score}`;
        }

        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('final-score').innerText = `نتيجتك: ${score} من ${currentQuestions.length}`;
        }

        window.onload = startQuiz;
    </script>
</body>
</html>
